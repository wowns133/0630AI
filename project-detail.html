<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 상세 — 스터디 가이드</title>
<style>
  :root {
    --bg:      #0b1120;
    --surface: #111827;
    --card:    #1a2540;
    --border:  #1e3050;
    --blue:    #2563eb;
    --blue-lt: #3b82f6;
    --blue-bg: rgba(37,99,235,.12);
    --green:   #16a34a;
    --green-lt:#22c55e;
    --green-bg:rgba(34,197,94,.12);
    --text:    #e2e8f0;
    --sub:     #94a3b8;
    --muted:   #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.7;
  }
  a { color: var(--blue-lt); text-decoration: none; }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .8rem 2rem;
    display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 50;
  }
  .back-btn {
    border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--sub);
    font-size: .82rem; padding: .3rem .9rem;
    cursor: pointer; transition: border-color .12s, color .12s;
  }
  .back-btn:hover { border-color: var(--blue); color: var(--blue-lt); }
  .topbar-title { font-size: .88rem; color: var(--muted); }

  /* ── HERO ── */
  .hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
  }
  .hero-inner { max-width: 760px; margin: 0 auto; }
  .hero-badges { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .badge {
    border-radius: 999px; font-size: .72rem; font-weight: 700; padding: .2rem .75rem;
  }
  .badge-level-입문 { background: var(--blue-bg); color: var(--blue-lt); border: 1px solid var(--blue); }
  .badge-level-중급 { background: rgba(234,179,8,.1); color: #facc15; border: 1px solid rgba(234,179,8,.3); }
  .badge-level-도전 { background: rgba(239,68,68,.1); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
  .badge-week { background: var(--green-bg); color: var(--green-lt); border: 1px solid var(--green); }
  .badge-tech { background: rgba(148,163,184,.08); color: var(--sub); border: 1px solid var(--border); }
  .hero h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 900; margin-bottom: .5rem; }
  .hero .desc { color: var(--sub); font-size: .95rem; line-height: 1.7; }
  .stars { margin-top: .6rem; }
  .star-on { color: var(--blue-lt); }
  .star-off { color: var(--border); }

  /* ── MAIN ── */
  main { max-width: 760px; margin: 0 auto; padding: 2rem 2rem 5rem; }

  /* ── SECTION ── */
  .section { margin-bottom: 2.8rem; }
  .section-title {
    font-size: 1rem; font-weight: 800;
    margin-bottom: 1.1rem; padding-bottom: .5rem;
    border-bottom: 2px solid var(--border);
    display: flex; align-items: center; gap: .5rem;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .dot-green { background: var(--green); }

  /* ── WHY BOX ── */
  .why-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    color: var(--sub);
    font-size: .91rem;
    line-height: 1.8;
  }

  /* ── FEATURE LIST ── */
  .feat-list { display: flex; flex-direction: column; gap: .65rem; }
  .feat-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 9px; padding: .9rem 1.1rem;
    display: flex; gap: .8rem; align-items: flex-start;
  }
  .feat-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); color: #fff;
    font-size: .7rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: .1rem;
  }
  .feat-text { font-size: .88rem; color: var(--sub); line-height: 1.65; }

  /* ── PREREQ ── */
  .prereq-list { display: flex; flex-wrap: wrap; gap: .5rem; }
  .prereq-tag {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: .35rem .9rem;
    font-size: .8rem; color: var(--sub);
  }

  /* ── WEEK PLAN ── */
  .week-list { display: flex; flex-direction: column; gap: .8rem; }
  .week-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .week-header {
    padding: .85rem 1.2rem;
    display: flex; align-items: center; gap: .8rem;
    cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .week-header:hover { background: rgba(37,99,235,.06); }
  .week-badge {
    background: var(--blue-bg); border: 1px solid var(--blue);
    border-radius: 6px; font-size: .7rem; font-weight: 800;
    color: var(--blue-lt); padding: .15rem .6rem; flex-shrink: 0;
  }
  .week-badge.ext { background: rgba(148,163,184,.08); border-color: var(--border); color: var(--muted); }
  .week-title { font-size: .9rem; font-weight: 700; flex: 1; }
  .week-toggle { font-size: .8rem; color: var(--muted); }
  .week-body {
    max-height: 0; overflow: hidden;
    transition: max-height .28s ease;
    border-top: 0px solid var(--border);
  }
  .week-body.open { max-height: 300px; border-top: 1px solid var(--border); }
  .week-tasks { padding: .9rem 1.2rem; list-style: none; display: flex; flex-direction: column; gap: .45rem; }
  .week-tasks li {
    font-size: .85rem; color: var(--sub);
    padding-left: 1rem; position: relative;
  }
  .week-tasks li::before {
    content: '›'; position: absolute; left: 0;
    color: var(--blue-lt); font-weight: 700;
  }

  /* ── SKILLS ── */
  .skill-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .skill-chip {
    background: var(--green-bg); border: 1px solid rgba(34,197,94,.3);
    border-radius: 999px; font-size: .78rem; font-weight: 600;
    color: var(--green-lt); padding: .22rem .85rem;
  }

  /* ── PORTFOLIO VALUE ── */
  .value-box {
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 10px; padding: 1.2rem 1.4rem;
    color: var(--sub); font-size: .9rem; line-height: 1.8;
  }

  /* ── CHECKLIST ── */
  .check-list { display: flex; flex-direction: column; gap: .5rem; }
  .check-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: .7rem 1rem;
    display: flex; align-items: center; gap: .8rem; cursor: pointer;
    transition: border-color .12s;
  }
  .check-item:hover { border-color: var(--blue); }
  .check-item.done { border-color: var(--green); opacity: .6; }
  .check-box {
    width: 18px; height: 18px; border-radius: 4px;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, border-color .12s;
  }
  .check-item.done .check-box { background: var(--green); border-color: var(--green); }
  .check-mark { color: #fff; font-size: .7rem; font-weight: 800; display: none; }
  .check-item.done .check-mark { display: block; }
  .check-label { font-size: .86rem; color: var(--sub); }
  .check-item.done .check-label { text-decoration: line-through; color: var(--muted); }

  /* ── NOT FOUND ── */
  .not-found {
    text-align: center; padding: 5rem 2rem; color: var(--muted);
  }
  .not-found h2 { font-size: 1.3rem; margin-bottom: .5rem; color: var(--sub); }

  @media (max-width: 600px) {
    .topbar { padding: .7rem 1rem; }
    main { padding: 1.5rem 1rem 4rem; }
    .hero { padding: 1.5rem 1rem 1.5rem; }
  }
</style>
</head>

/* ─────────────────────────────────────────
   RENDER
───────────────────────────────────────── */
function stars(n) {
  return Array.from({length:5}, (_,i) =>
    `<span class="${i<n?'star-on':'star-off'}">★</span>`).join('');
}

function weekBadgeClass(w) {
  return w.ext ? 'week-badge ext' : 'week-badge';
}

function render(idea) {
  const weekHtml = idea.weekPlan.map((w, i) => `
    <div class="week-card">
      <div class="week-header" onclick="toggleWeek(${i})">
        <span class="${weekBadgeClass(w)}">${w.week}</span>
        <span class="week-title">${w.title}</span>
        <span class="week-toggle" id="wtog-${i}">▼</span>
      </div>
      <div class="week-body${i===0?' open':''}" id="wbody-${i}">
        <ul class="week-tasks">
          ${w.tasks.map(t=>`<li>${t}</li>`).join('')}
        </ul>
      </div>
    </div>`).join('');

  const checkKey = `checklist_${idea.id}`;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(checkKey)||'{}'); } catch {}

  const checkHtml = idea.checklist.map((c, i) => {
    const isDone = !!done[i];
    return `<div class="check-item${isDone?' done':''}" onclick="toggleCheck(${idea.id},${i})" id="ci-${i}">
      <div class="check-box"><span class="check-mark">✓</span></div>
      <span class="check-label">${c}</span>
    </div>`;
  }).join('');

  const techBadges = idea.techs.map(t=>`<span class="badge badge-tech">${t}</span>`).join('');

  document.getElementById('topbar-title').textContent = idea.title;
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-badges">
          <span class="badge badge-level-${idea.level}">${idea.level}</span>
          ${idea.twoWeeks ? '<span class="badge badge-week">2주 완성</span>' : '<span class="badge badge-week">3주+ 권장</span>'}
          ${techBadges}
        </div>
        <h1>${idea.title}</h1>
        <div class="desc">${idea.desc}</div>
        <div class="stars">${stars(idea.stars)}</div>
      </div>
    </div>

    <main>
      <div class="section">
        <div class="section-title"><span class="dot"></span>왜 지금 만들면 좋은가</div>
        <div class="why-box">${idea.why}</div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot"></span>핵심 기능</div>
        <div class="feat-list">
          ${idea.features.map((f,i)=>`
            <div class="feat-item">
              <div class="feat-num">${i+1}</div>
              <div class="feat-text">${f}</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot"></span>시작 전 필요한 것</div>
        <div class="prereq-list">
          ${idea.prereqs.map(p=>`<span class="prereq-tag">${p}</span>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot"></span>개발 계획</div>
        <div class="week-list">${weekHtml}</div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot dot-green"></span>완성 후 얻는 기술</div>
        <div class="skill-chips">
          ${idea.skills.map(s=>`<span class="skill-chip">${s}</span>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot dot-green"></span>포트폴리오 가치</div>
        <div class="value-box">${idea.portfolioValue}</div>
      </div>

      <div class="section">
        <div class="section-title"><span class="dot"></span>시작 체크리스트</div>
        <div class="check-list">${checkHtml}</div>
      </div>
    </main>`;
}

function toggleWeek(i) {
  const body = document.getElementById(`wbody-${i}`);
  const tog  = document.getElementById(`wtog-${i}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if (tog) tog.textContent = isOpen ? '▼' : '▲';
}

function toggleCheck(ideaId, idx) {
  const key = `checklist_${ideaId}`;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(key)||'{}'); } catch {}
  done[idx] = !done[idx];
  localStorage.setItem(key, JSON.stringify(done));

  const el = document.getElementById(`ci-${idx}`);
  if (el) el.classList.toggle('done', !!done[idx]);
}

      <p><a href="my-portfolio.html">← 포트폴리오로 돌아가기</a></p>
    </div>`;
} else {
  render(idea);
}
