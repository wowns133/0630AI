<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방학 스터디 아이디어 생성기</title>
<style>
  :root {
    --bg:      #0b1120;
    --surface: #111827;
    --card:    #1a2540;
    --border:  #1e3050;
    --blue:    #2563eb;
    --blue-lt: #3b82f6;
    --blue-bg: rgba(37,99,235,.12);
    --green:   #16a34a;
    --green-lt:#22c55e;
    --green-bg:rgba(34,197,94,.12);
    --text:    #e2e8f0;
    --sub:     #94a3b8;
    --muted:   #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
  }
  header h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: -.02em;
    margin-bottom: .4rem;
  }
  header h1 span { color: var(--blue-lt); }
  header p {
    color: var(--sub);
    font-size: .9rem;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── KEYWORD PANEL ── */
  .kw-panel {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 1.4rem 2rem;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .kw-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
    margin-bottom: .6rem;
  }
  .kw-row:last-child { margin-bottom: 0; }
  .kw-cat {
    font-size: .7rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    min-width: 36px;
    flex-shrink: 0;
  }
  .kw-btn {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .28rem .9rem;
    font-size: .8rem;
    font-weight: 600;
    color: var(--sub);
    background: transparent;
    cursor: pointer;
    transition: border-color .12s, color .12s, background .12s;
    white-space: nowrap;
  }
  .kw-btn:hover { border-color: var(--blue); color: var(--blue-lt); }
  .kw-btn.active-trend {
    background: var(--blue-bg);
    border-color: var(--blue);
    color: var(--blue-lt);
  }
  .kw-btn.active-tech {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green-lt);
  }
  .kw-btn.active-level {
    background: rgba(148,163,184,.12);
    border-color: var(--sub);
    color: var(--text);
  }

  /* ── MATCH BAR ── */
  .match-bar {
    max-width: 900px;
    margin: 1.4rem auto .2rem;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .6rem;
  }
  .match-count {
    font-size: .82rem;
    color: var(--sub);
  }
  .match-count strong { color: var(--blue-lt); font-size: 1.1rem; }
  .reset-btn {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .25rem .8rem;
    font-size: .76rem;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: border-color .12s, color .12s;
  }
  .reset-btn:hover { border-color: var(--blue); color: var(--blue-lt); }

  /* ── CARD GRID ── */
  .grid {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 2rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: .9rem;
  }

  /* ── IDEA CARD ── */
  .idea-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, opacity .2s;
  }
  .idea-card.dimmed { opacity: .35; }
  .idea-card.matched { border-color: var(--blue); }
  .idea-card.matched.top { border-color: var(--green); }

  .card-top {
    padding: 1.1rem 1.2rem .9rem;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: .6rem;
    gap: .4rem;
  }
  .card-num {
    font-size: .68rem;
    font-weight: 800;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: .15rem;
  }
  .card-title {
    font-size: .98rem;
    font-weight: 800;
    color: var(--text);
    flex: 1;
    line-height: 1.35;
  }
  .score-badge {
    flex-shrink: 0;
    background: var(--green-bg);
    border: 1px solid var(--green);
    border-radius: 6px;
    font-size: .68rem;
    font-weight: 800;
    color: var(--green-lt);
    padding: .1rem .4rem;
    display: none;
  }
  .score-badge.show { display: block; }

  .card-desc {
    font-size: .84rem;
    color: var(--sub);
    margin-bottom: .8rem;
    line-height: 1.55;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin-bottom: .6rem;
  }
  .tag {
    border-radius: 999px;
    font-size: .7rem;
    font-weight: 700;
    padding: .15rem .6rem;
  }
  .tag-trend { background: var(--blue-bg); color: var(--blue-lt); }
  .tag-tech  { background: var(--green-bg); color: var(--green-lt); }
  .tag.hl-trend { background: var(--blue); color: #fff; }
  .tag.hl-tech  { background: var(--green); color: #fff; }

  .stars {
    font-size: .78rem;
    letter-spacing: .05em;
  }
  .star-filled { color: var(--blue-lt); }
  .star-empty  { color: var(--border); }

  .card-footer {
    border-top: 1px solid var(--border);
    padding: .6rem 1.2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .level-badge {
    font-size: .7rem;
    font-weight: 700;
    border-radius: 999px;
    padding: .12rem .55rem;
  }
  .lv-입문 { background: var(--blue-bg);         color: var(--blue-lt); }
  .lv-중급 { background: rgba(234,179,8,.1);      color: #facc15; }
  .lv-도전 { background: rgba(239,68,68,.1);      color: #f87171; }
  .weeks {
    font-size: .7rem;
    color: var(--muted);
  }
  .weeks.ok { color: var(--green-lt); }
  .toggle-icon {
    font-size: .72rem;
    color: var(--muted);
    margin-left: .4rem;
  }

  /* ── DETAIL PANEL ── */
  .detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
    border-top: 0px solid var(--border);
  }
  .detail.open {
    max-height: 400px;
    border-top: 1px solid var(--border);
  }
  .detail-inner {
    padding: 1rem 1.2rem 1.1rem;
  }
  .detail-section { margin-bottom: .9rem; }
  .detail-label {
    font-size: .68rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: .4rem;
  }
  .feature-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .feature-list li {
    font-size: .82rem;
    color: var(--sub);
    padding-left: .9rem;
    position: relative;
  }
  .feature-list li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--blue-lt);
    font-weight: 700;
  }
  .ref-row {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
  }
  .ref-tag {
    background: rgba(148,163,184,.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: .72rem;
    color: var(--sub);
    padding: .12rem .55rem;
  }
  .why-text {
    font-size: .82rem;
    color: var(--sub);
    line-height: 1.6;
    border-left: 2px solid var(--blue);
    padding-left: .7rem;
  }

  /* ── ADD BUTTON ── */
  .add-btn {
    border: 1px solid var(--blue);
    border-radius: 7px;
    padding: .22rem .75rem;
    font-size: .72rem;
    font-weight: 700;
    color: var(--blue-lt);
    background: var(--blue-bg);
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
    white-space: nowrap;
  }
  .add-btn:hover:not(:disabled) { background: var(--blue); color: #fff; }
  .add-btn.added {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green-lt);
    cursor: default;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--green);
    color: #fff;
    padding: .6rem 1.4rem;
    border-radius: 8px;
    font-size: .85rem;
    font-weight: 700;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: .9rem;
  }

  @media (max-width: 600px) {
    .kw-panel { padding: 1rem; }
    .grid { padding: 1rem 1rem 3rem; }
    .match-bar { padding: 0 1rem; }
  }
</style>
</head>

    features: ['팀원 등록 및 미션 배분', 'To-Do · In-Progress · Done 칸반 보드', '완료율 시각화 대시보드'],
    twoWeeks: false,
    refs: ['드래그앤드롭 API', 'localStorage 복잡한 상태 관리', 'Python Flask 기초 (서버 연동 시)'],
  },
];

const KW_CONFIG = {
  trend: ['가격비교', '일상자동화', '건강관리', '감정관리', 'AI활용', '개인화'],
  tech:  ['웹개발', 'API연동', '자동화', '데이터'],
  level: ['입문', '중급', '도전'],
};

const selected = { trend: new Set(), tech: new Set(), level: new Set() };
const openCards = new Set();

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
function init() {
  buildKeywords('trend', 'row-trend', 'active-trend');
  buildKeywords('tech',  'row-tech',  'active-tech');
  buildKeywords('level', 'row-level', 'active-level');
  renderCards();
}

function buildKeywords(cat, rowId, activeClass) {
  const row = document.getElementById(rowId);
  KW_CONFIG[cat].forEach(kw => {
    const btn = document.createElement('button');
    btn.className = 'kw-btn';
    btn.textContent = kw;
    btn.dataset.cat = cat;
    btn.dataset.kw = kw;
    btn.dataset.active = activeClass;
    btn.onclick = () => toggleKw(cat, kw, btn, activeClass);
    row.appendChild(btn);
  });
}

/* ─────────────────────────────────────────
   KEYWORD TOGGLE
───────────────────────────────────────── */
function toggleKw(cat, kw, btn, activeClass) {
  if (selected[cat].has(kw)) {
    selected[cat].delete(kw);
    btn.classList.remove(activeClass);
  } else {
    selected[cat].add(kw);
    btn.classList.add(activeClass);
  }
  renderCards();
}

function resetAll() {
  ['trend', 'tech', 'level'].forEach(cat => {
    selected[cat].clear();
    document.querySelectorAll(`[data-cat="${cat}"]`).forEach(btn => {
      btn.classList.remove(btn.dataset.active);
    });
  });
  openCards.clear();
  renderCards();
}

/* ─────────────────────────────────────────
   SCORING
───────────────────────────────────────── */
function anySelected() {
  return selected.trend.size > 0 || selected.tech.size > 0 || selected.level.size > 0;
}

function score(idea) {
  let s = 0;
  selected.trend.forEach(k => { if (idea.trends.includes(k)) s += 2; });
  selected.tech.forEach(k  => { if (idea.techs.includes(k))  s += 2; });
  if (selected.level.size > 0 && selected.level.has(idea.level)) s += 3;
  return s;
}

/* ─────────────────────────────────────────
   RENDER
───────────────────────────────────────── */
function renderCards() {
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('matchCount');
  grid.innerHTML = '';

  const hasFilter = anySelected();

  let sorted = IDEAS.map(idea => ({ idea, s: score(idea) }));
  if (hasFilter) sorted.sort((a, b) => b.s - a.s);

  const matched = hasFilter ? sorted.filter(x => x.s > 0) : sorted;
  const maxScore = hasFilter ? (matched[0]?.s || 0) : 0;

  if (hasFilter) {
    if (matched.length === 0) {
      countEl.innerHTML = '매칭된 아이디어가 없습니다. 다른 키워드를 선택해보세요.';
    } else {
      countEl.innerHTML = `<strong>${matched.length}</strong>개 아이디어 매칭됨`;
    }
  } else {
    countEl.textContent = '키워드를 선택하면 매칭된 아이디어를 보여줍니다';
  }

  if (sorted.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '매칭된 아이디어가 없습니다. 다른 키워드를 선택해보세요.';
    grid.appendChild(empty);
    return;
  }

  sorted.forEach(({ idea, s }) => {
    const isMatched = !hasFilter || s > 0;
    const isTop = hasFilter && s === maxScore && s > 0;
    grid.appendChild(makeCard(idea, s, isMatched, isTop, hasFilter));
  });
}

function makeCard(idea, s, isMatched, isTop, hasFilter) {
  const isOpen = openCards.has(idea.id);
  const isAdded = getTodos().some(t => t.id === idea.id);

  const card = document.createElement('div');
  card.className = 'idea-card' +
    (hasFilter && isTop    ? ' matched top' :
     hasFilter && isMatched? ' matched' :
     hasFilter             ? ' dimmed' : '');
  card.id = `card-${idea.id}`;

  // Stars
  const filled = '★'.repeat(idea.stars) + '☆'.repeat(5 - idea.stars);
  const starHtml = filled.split('').map((c, i) =>
    `<span class="${i < idea.stars ? 'star-filled' : 'star-empty'}">${c}</span>`
  ).join('');

  // Tags
  const trendTags = idea.trends.map(t => {
    const hl = hasFilter && selected.trend.has(t);
    return `<span class="tag tag-trend${hl ? ' hl-trend' : ''}">${t}</span>`;
  }).join('');

  const techTags = idea.techs.map(t => {
    const hl = hasFilter && selected.tech.has(t);
    return `<span class="tag tag-tech${hl ? ' hl-tech' : ''}">${t}</span>`;
  }).join('');

  const scoreBadge = hasFilter && s > 0
    ? `<span class="score-badge show">${s}점</span>`
    : `<span class="score-badge"></span>`;

  // Features
  const featureHtml = idea.features.map(f => `<li>${f}</li>`).join('');

  // Refs
  const refHtml = idea.refs.map(r => `<span class="ref-tag">${r}</span>`).join('');

  const twoWeeksText = idea.twoWeeks
    ? '<span class="weeks ok">✓ 2주 완성 가능</span>'
    : '<span class="weeks">3주+ 권장</span>';

  card.innerHTML = `
    <div class="card-top" onclick="toggleDetail(${idea.id})">
      <div class="card-header">
        <span class="card-num">#${String(idea.id).padStart(2,'0')}</span>
        <span class="card-title">${idea.title}</span>
        ${scoreBadge}
      </div>
      <div class="card-desc">${idea.desc}</div>
      <div class="tag-row">${trendTags}${techTags}</div>
      <div class="stars">${starHtml}</div>
    </div>
    <div class="card-footer" onclick="toggleDetail(${idea.id})" style="cursor:pointer">
      <span class="level-badge lv-${idea.level}">${idea.level}</span>
      ${twoWeeksText}
      <button class="add-btn${isAdded ? ' added' : ''}" id="add-${idea.id}"
        onclick="addIdea(${idea.id}, event)"${isAdded ? ' disabled' : ''}>
        ${isAdded ? '✓ 추가됨' : '+ 추가'}
      </button>
      <span class="toggle-icon">${isOpen ? '▲' : '▼'}</span>
    </div>
    <div class="detail${isOpen ? ' open' : ''}" id="detail-${idea.id}">
      <div class="detail-inner">
        <div class="detail-section">
          <div class="detail-label">핵심 기능</div>
          <ul class="feature-list">${featureHtml}</ul>
        </div>
        <div class="detail-section">
          <div class="detail-label">왜 지금 만들면 좋은가</div>
          <div class="why-text">${idea.why}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">공부해야 할 것</div>
          <div class="ref-row">${refHtml}</div>
        </div>
      </div>
    </div>`;

  return card;
}

function toggleDetail(id) {
  const detail = document.getElementById(`detail-${id}`);
  const card   = document.getElementById(`card-${id}`);
  if (!detail) return;

  if (openCards.has(id)) {
    openCards.delete(id);
    detail.classList.remove('open');
    card.querySelector('.toggle-icon').textContent = '▼';
  } else {
    openCards.add(id);
    detail.classList.add('open');
    card.querySelector('.toggle-icon').textContent = '▲';
  }
}

/* ─────────────────────────────────────────
   LOCALSTORAGE SYNC
───────────────────────────────────────── */
const STORAGE_KEY = 'portfolio_todos';

function getTodos() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}

function saveTodos(todos) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function addIdea(id, e) {
  e.stopPropagation();
  const idea = IDEAS.find(i => i.id === id);
  if (!idea) return;

  const todos = getTodos();
  if (todos.some(t => t.id === id)) return;

  todos.push({
    id: idea.id,
    title: idea.title,
    desc: idea.desc,
    techs: idea.techs,
    level: idea.level,
    stars: idea.stars,
    twoWeeks: idea.twoWeeks,
  });
  saveTodos(todos);

  const btn = document.getElementById(`add-${id}`);
  if (btn) {
    btn.textContent = '✓ 추가됨';
    btn.classList.add('added');
    btn.disabled = true;
  }

  showToast(`"${idea.title}" 포트폴리오에 추가됐습니다`);
}

function showToast(msg) {
  let toast = document.getElementById('global-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'global-toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
