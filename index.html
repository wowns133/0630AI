<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0630AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0b1120;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px 20px;
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #6c63ff, #43e97b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #8888aa;
    font-size: 1rem;
    margin-top: -36px;
    text-align: center;
  }
  .cards {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #111827;
    border: 1px solid #2e2e40;
    border-radius: 16px;
    padding: 32px 36px;
    width: 260px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s;
  }
  a.card:hover {
    border-color: #6c63ff;
    transform: translateY(-4px);
  }
  .card-icon { font-size: 2rem; }
  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #e8e8f0;
  }
  .card-desc {
    font-size: 0.85rem;
    color: #8888aa;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>0630AI</h1>
  <p class="subtitle">명재준의 프로젝트 모음</p>
  <div class="cards">
    <a class="card" href="my-portfolio.html">
      <span class="card-icon">🗂️</span>
      <span class="card-title">포트폴리오</span>
      <span class="card-desc">경험, 프로젝트, 스킬을 정리한 개인 포트폴리오</span>
    </a>
    <a class="card" href="study-idea-generator.html">
      <span class="card-icon">💡</span>
      <span class="card-title">방학 스터디 아이디어</span>
      <span class="card-desc">AI 기반 방학 스터디 주제 추천 생성기</span>
    </a>
  </div>
</body>
</html>
